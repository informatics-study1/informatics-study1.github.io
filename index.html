<!doctype html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>情報科 授業支援サイト</title>
<style>
:root{
  --ink:#26313b;
  --muted:#7a828a;
  --line:#dfe3e6;
  --accent:#314c5d;
  --accent-soft:#e9eef1;
  --accent-deep:#203847;
  --bg:#ffffff;
  --soft:#f7f8f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
  line-height:1.7;
}
a{color:inherit;text-decoration:none}
header{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#ffffff 0%,#fafbfb 100%);
  position:sticky;
  top:0;
  z-index:10;
}
.header-inner{
  max-width:920px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.site-name{
  font-size:1.08rem;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--accent-deep);
  position:relative;
  padding-left:16px;
}
.site-name::before{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:5px;
  height:22px;
  border-radius:999px;
  background:var(--accent);
  transform:translateY(-50%);
}
nav{
  display:flex;
  gap:18px;
  font-size:.88rem;
  color:var(--muted);
}
nav a{
  position:relative;
  padding-bottom:4px;
}
nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:1px;
  background:var(--accent);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .18s ease;
}
nav a:hover{color:var(--accent)}
nav a:hover::after{transform:scaleX(1)}
main{
  max-width:920px;
  margin:auto;
  padding:30px 24px 72px;
}
.notice{
  padding:18px 20px;
  margin-bottom:34px;
  background:linear-gradient(90deg,var(--accent-soft) 0%,#f8faf9 100%);
  border:1px solid #d6dfe3;
  border-left:4px solid var(--accent);
  border-radius:10px;
}
.notice-title{
  font-weight:700;
  margin-bottom:4px;
  color:var(--accent-deep);
  letter-spacing:.04em;
}
section{
  padding:28px 0;
  border-top:1px solid var(--line);
}
section:first-of-type{
  border-top:none;
  padding-top:0;
}
.section-title{
  margin:0 0 20px;
  font-size:1.2rem;
  font-weight:700;
  color:var(--accent-deep);
  display:flex;
  align-items:center;
  gap:10px;
}
.section-title::before{
  content:"";
  width:24px;
  height:3px;
  border-radius:999px;
  background:var(--accent);
}
.course{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:28px;
  padding:20px 0;
  border-top:1px solid var(--line);
}
.course:first-of-type{border-top:none;padding-top:0}
.course-name{
  font-weight:700;
  color:var(--accent-deep);
  letter-spacing:.02em;
}
.link-list{
  display:grid;
  gap:8px;
}
.link-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  margin-bottom:12px;
  border:1px solid #d9e1e5;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  transition:all .2s ease;
}
.link-item:hover{
  background:#f7fafb;
  border-color:#c8d2d8;
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.arrow{
  color:var(--accent);
  font-size:.9rem;
  font-weight:700;
}
.tool-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px 28px;
}
.tool-link{
  display:block;
  width:100%;
  min-height:88px;
  padding:16px 18px;
  border:1px solid #d9e1e5;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  transition:all .2s ease;
}
.tool-link:hover{
  background:#f7fafb;
  border-color:#c8d2d8;
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.tool-link strong{
  display:block;
  font-size:.97rem;
}
.tool-link span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:.82rem;
}
footer{
  border-top:1px solid var(--line);
  padding:24px;
  text-align:center;
  color:var(--muted);
  font-size:.8rem;
  background:#fafbfb;
}
@media(max-width:700px){
  nav{display:none}
  .course{grid-template-columns:1fr;gap:10px}
  .tool-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="site-name">情報科 授業支援サイト</div>
    <nav>
      <a href="#classes">授業</a>
      <a href="#tools">ツール</a>
      <a href="#course">教養講座</a>
    </nav>
  </div>
</header>

<main>
  <div class="notice">
    <div class="notice-title">お知らせ</div>
    <div>高2情報Ⅰは，ProgateのPythonコース「基礎文法編・繰り返し処理編・関数編・問題集」に取り組んでください。</div>
  </div>

  <section id="classes">
    <h2 class="section-title">授業</h2>

    <div class="course">
      <div class="course-name">高2情報Ⅰ</div>
      <div class="link-list">
        <a class="link-item" href="https://sites.google.com/st.friends.ac.jp/info/%E9%AB%982%E6%83%85%E5%A0%B1/%E6%83%85%E5%A0%B1%E7%A4%BE%E4%BC%9A%E3%81%AE%E5%95%8F%E9%A1%8C%E8%A7%A3%E6%B1%BA"><span>情報社会の問題解決</span><span class="arrow">→</span></a>
        <a class="link-item" href="https://sites.google.com/st.friends.ac.jp/info/%E9%AB%982%E6%83%85%E5%A0%B1/%E3%83%97%E3%83%AD%E3%82%B0%E3%83%A9%E3%83%9F%E3%83%B3%E3%82%B0"><span>プログラミング</span><span class="arrow">→</span></a>
        <a class="link-item" href="https://sites.google.com/st.friends.ac.jp/info/%E9%AB%982%E6%83%85%E5%A0%B1/%E3%82%B7%E3%83%9F%E3%83%A5%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3"><span>シミュレーション</span><span class="arrow">→</span></a>
      </div>
    </div>

    <div class="course">
      <div class="course-name">高3演習情報Ⅰ</div>
      <div class="link-list">
        <a class="link-item" href="https://sites.google.com/st.friends.ac.jp/info/%E9%AB%983%E6%BC%94%E7%BF%92%E6%83%85%E5%A0%B1"><span>授業ページ</span><span class="arrow">→</span></a>
      </div>
    </div>

    <div class="course">
      <div class="course-name">中3技術</div>
      <div class="link-list">
        <a class="link-item" href="https://manabi-gakushu.benesse.ne.jp/gakushu/typing/nihongonyuryoku.html" target="_blank"><span>タイピング練習（マナビジョン）</span><span class="arrow">→</span></a>
      </div>
    </div>
  </section>

  <section id="tools">
    <h2 class="section-title">学習ツール</h2>
    <div class="tool-list">
      <a class="tool-link" href="https://bitarrow3.eplang.jp/bitarrow/?Login/form" target="_blank">
        <strong>Bit Arrow</strong>
        <span>オンラインプログラミング環境</span>
      </a>
      <a class="tool-link" href="https://prog-8.com/" target="_blank">
        <strong>Progate</strong>
        <span>高2情報Ⅰ夏休みの課題</span>
      </a>
    </div>
  </section>

  <section id="course">
    <h2 class="section-title">特別講座</h2>
    <div class="link-list">
      <a class="link-item" href="https://sites.google.com/st.friends.ac.jp/info/2026%E5%A4%8F%E6%9C%9F%E6%95%99%E9%A4%8A%E8%AC%9B%E5%BA%A7"><span>3Dプリンタでネームプレートを作成しよう</span><span class="arrow">→</span></a>
    </div>
  </section>
</main>

<footer>© 2026 情報科授業支援サイト</footer>
</body>
</html>
