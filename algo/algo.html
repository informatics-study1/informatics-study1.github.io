<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="バブルソート・選択ソート・挿入ソートの比較と交換を視覚的に学べるWebアプリ" />
    <title>アルゴリズム図鑑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main>
        <section class="workspace" aria-label="ソートアルゴリズム可視化ツール">
          <div class="top-controls">
            <fieldset class="algorithm-switch" aria-label="アルゴリズムを選択">
              <div class="algorithm-options">
                <label><input type="radio" name="algorithm" value="linear" checked /><span>線形探索</span></label>
                <label><input type="radio" name="algorithm" value="binary" /><span>二分探索</span></label>
                <label><input type="radio" name="algorithm" value="bubble" /><span>バブルソート</span></label>
                <label><input type="radio" name="algorithm" value="selection" /><span>選択ソート</span></label>
                <label><input type="radio" name="algorithm" value="insertion" /><span>挿入ソート</span></label>
              </div>
            </fieldset>
            <div class="top-speed">
              <div class="setting-heading"><label for="speedRange">アニメーション速度</label><output id="speedOutput">ふつう</output></div>
              <div class="top-speed-range">
                <input id="speedRange" type="range" min="1" max="5" value="3" />
                <div class="range-labels"><span>ゆっくり</span><span>はやい</span></div>
              </div>
            </div>
          </div>

          <div class="visual-panel">
            <div class="panel-topline">
              <h1 id="algorithmTitle">バブルソート</h1>
              <div class="legend" aria-label="色の説明">
                <span><i class="dot comparing"></i>比較中</span>
                <span><i class="dot sorted"></i><span id="sortedLegendLabel">整列済み</span></span>
              </div>
            </div>

            <div class="chart-wrap">
              <div class="variable-display">
                <span>変数</span>
                <p class="variable-message" id="variableMessage" aria-live="polite">添字は各要素の下に表示されます。</p>
              </div>
              <div class="bars" id="bars" role="img" aria-label="並べ替える数値のカード"></div>
            </div>

            <div class="code-panel" id="codePanel" aria-label="Python code">
              <div class="code-panel-heading">Python</div>
              <ol class="python-code" id="pythonCode"></ol>
            </div>

            <div class="process-card" aria-live="polite">
              <div>
                <p class="process-message" id="processMessage">「実行」を押すと、並べ替えを開始します。</p>
              </div>
            </div>

            <div class="controls">
              <button class="icon-button" id="resetButton" type="button" title="リセット" aria-label="リセット">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.9 7.5A8 8 0 1 1 4 14m.9-6.5V3m0 4.5h4.5"/></svg>
              </button>
              <button class="play-button" id="playButton" type="button">
                <span id="playLabel">実行 ▶</span>
              </button>
              <button class="step-button" id="stepButton" type="button">ステップ実行 <span>▷</span></button>
            </div>
          </div>

          <aside class="settings-panel">
            <div class="setting-group array-input-group">
              <label class="array-input-label" for="arrayInput">配列を入力</label>
              <div class="array-input-row">
                <input id="arrayInput" type="text" inputmode="numeric" autocomplete="off" placeholder="例：72, 46, 39, 64, 19" aria-describedby="arrayInputHint arrayInputError" />
                <button id="applyArrayButton" type="button">反映</button>
              </div>
              <p class="array-input-hint" id="arrayInputHint">5〜14個の整数をカンマで区切って入力</p>
              <p class="array-input-error" id="arrayInputError" role="alert"></p>
            </div>

            <div class="setting-group search-target-group" id="searchTargetGroup" hidden>
              <label class="array-input-label" for="searchTargetInput">探索する値</label>
              <input id="searchTargetInput" type="number" min="1" max="99" value="50" inputmode="numeric" />
            </div>

            <fieldset class="setting-group direction-group">
              <legend>走査方向</legend>
              <div class="direction-options">
                <label><input type="radio" name="direction" value="ltr" checked /><span>左 → 右</span></label>
                <label><input type="radio" name="direction" value="rtl" /><span>右 → 左</span></label>
              </div>
            </fieldset>

            <fieldset class="setting-group direction-group">
              <legend>表示形式</legend>
              <div class="direction-options">
                <label><input type="radio" name="displayMode" value="cards" checked /><span>カード</span></label>
                <label><input type="radio" name="displayMode" value="bars" /><span>棒グラフ</span></label>
              </div>
            </fieldset>

            <div class="stats" aria-label="実行統計">
              <div><span id="comparisonLabel">比較回数</span><strong id="comparisonCount">0</strong></div>
              <div><span id="secondaryStatLabel">交換回数</span><strong id="swapCount">0</strong></div>
            </div>

            <div class="tip-card">
              <span class="tip-icon">i</span>
              <div><b id="algorithmTipTitle">バブルソートとは？</b><p id="algorithmTipText">隣り合う2つの値を順に比較し、左の値が大きければ入れ替える整列方法です。左から走査すると最大値が右端へ、右から走査すると最小値が左端へ確定します。この処理を交換がなくなるまで繰り返します。</p></div>
            </div>
          </aside>
        </section>

      </main>

    </div>
    <script src="app.js"></script>
  </body>
</html>
